[project]
name = "watchtaskconcentration"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "yasutaka-asai", email = "yasutaka.asai@mail.benesse.co.jp" }
]
dependencies = [
    "pydantic>=2.10.5",
    "openai>=1.59.6",
    "pillow>=11.1.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/watchtaskconcentration"]
